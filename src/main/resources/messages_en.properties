# BedrockMenus messages (MiniMessage). <prefix> is replaced with the prefix below (put a space after it).
# Arguments: <arg:0>, <arg:1>, ... Players see the file matching their client language.
# form-* and chat-* texts are shown on Bedrock forms: colors work, hover/click tags do not.
prefix=<aqua>BedrockMenus</aqua> <dark_gray>»</dark_gray>

# Menu forms
form-default-title=Menu
form-content=<gray>Tap an option.
form-empty=<gray>There is nothing to show in this menu.
form-changed=<yellow>The menu changed, here is its current state.
form-close=<red>Close
form-back=<gray>« Back
form-select=<green>Select
form-left-click=<green>Left click
form-right-click=<yellow>Right click
form-shift-left-click=<gold>Shift + left click
form-shift-right-click=<gold>Shift + right click

# Chat button forms (titles: see chat-buttons.titles in config.yml)
chat-close=<gray>Close
chat-title.default=Request
chat-title.teleport=Teleport Request
chat-title.party=Party Invite
chat-title.friend=Friend Request
chat-title.duel=Duel Request

# Command
reloaded=<prefix> <green>Configuration and messages reloaded.</green>
reload-failed=<prefix> <red>Could not read the configuration, check the server console.</red>
status=<prefix> <gray>Version: <white><arg:0></white> <dark_gray>|</dark_gray> Floodgate: <white><arg:1></white> <dark_gray>|</dark_gray> Open form menus: <white><arg:2></white> <dark_gray>|</dark_gray> Item icons: <white><arg:3></white></gray>
usage=<prefix> <gray>Usage: <white>/bedrockmenus reload</white> <dark_gray>|</dark_gray> <white>/bedrockmenus status</white></gray>
no-permission=<prefix> <red>You do not have permission to do that.</red>
answer-usage=<prefix> <gray>Usage: <white>/bedrockmenus answer [id] [button|close]</white> (debug, players only)</gray>
answer-none=<prefix> <red>There is no pending form with that number.</red>
installed=installed
not-installed=not installed
