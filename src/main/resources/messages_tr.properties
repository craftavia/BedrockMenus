# BedrockMenus mesajları (MiniMessage). <prefix> aşağıdaki önekle değişir (arkasına bir boşluk bırak).
# Değişkenler: <arg:0>, <arg:1>, ... Oyuncu, oyun dili Türkçe ise bu dosyayı görür.
# form-* ve chat-* metinleri Bedrock formlarında görünür: renkler çalışır, hover/tıklama etiketleri çalışmaz.
prefix=<aqua>BedrockMenus</aqua> <dark_gray>»</dark_gray>

# Menü formları
form-default-title=Menü
form-content=<gray>Bir seçeneğe dokun.
form-empty=<gray>Bu menüde gösterilecek bir şey yok.
form-changed=<yellow>Menü değişti, güncel hali açıldı.
form-close=<red>Kapat
form-back=<gray>« Geri
form-select=<green>Seç
form-left-click=<green>Sol tık
form-right-click=<yellow>Sağ tık
form-shift-left-click=<gold>Shift + sol tık
form-shift-right-click=<gold>Shift + sağ tık

# Sohbet düğmesi formları (başlıklar: config.yml içindeki chat-buttons.titles)
chat-close=<gray>Kapat
chat-title.default=İstek
chat-title.teleport=Işınlanma İsteği
chat-title.party=Parti Daveti
chat-title.friend=Arkadaşlık İsteği
chat-title.duel=Düello İsteği

# Komut
reloaded=<prefix> <green>Ayarlar ve mesajlar yeniden yüklendi.</green>
reload-failed=<prefix> <red>Ayarlar okunamadı, sunucu konsoluna bak.</red>
status=<prefix> <gray>Sürüm: <white><arg:0></white> <dark_gray>|</dark_gray> Floodgate: <white><arg:1></white> <dark_gray>|</dark_gray> Açık form menüsü: <white><arg:2></white> <dark_gray>|</dark_gray> Eşya resmi: <white><arg:3></white></gray>
usage=<prefix> <gray>Kullanım: <white>/bedrockmenus reload</white> <dark_gray>|</dark_gray> <white>/bedrockmenus status</white></gray>
no-permission=<prefix> <red>Bunun için yetkin yok.</red>
answer-usage=<prefix> <gray>Kullanım: <white>/bedrockmenus answer [no] [düğme|close]</white> (test için, yalnız oyuncular)</gray>
answer-none=<prefix> <red>Bu numarada bekleyen form yok.</red>
installed=kurulu
not-installed=kurulu değil
